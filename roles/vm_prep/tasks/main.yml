---
# Rôle vm_prep : prépare la VM hôte

# docker.io est déjà installé par bootstrap.sh, ici on s'assure juste qu'il est là.
# python3-docker sert aux modules docker d'Ansible (création réseau, conteneurs...)
- name: Installer Docker et la librairie python docker
  apt:
    name:
      - docker.io
      - python3-docker
    state: present
    update_cache: yes
    cache_valid_time: 3600   # pas de apt update si déjà fait il y a moins d'1h

- name: Docker démarré et lancé au boot
  service:
    name: docker
    state: started
    enabled: yes

# Elasticsearch refuse de démarrer si cette valeur est trop basse (65530 par défaut).
# Le fichier dans /etc/sysctl.d/ permet de garder le réglage après un reboot.
- name: vm.max_map_count à 262144 pour Elasticsearch
  sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-elasticsearch.conf
    reload: yes

# Réseau des 5 conteneurs. bootstrap.sh l'a déjà créé pour CT-manager,
# Ansible vérifie qu'il existe avec la bonne config (sinon il le crée).
- name: Réseau Docker infra_soc
  community.docker.docker_network:
    name: infra_soc
    driver: bridge
    ipam_config:
      - subnet: 192.168.70.0/24
        gateway: 192.168.70.1

# --- Conteneurs CT-target et CT-attacker ---
# Les Dockerfiles sont dans le projet (sur CT-manager), mais Docker tourne sur la VM :
# on les copie d'abord sur la VM, avec la clé publique SSH, puis on construit les images.

- name: Copier les Dockerfiles sur la VM
  copy:
    src: "{{ playbook_dir }}/docker/{{ item }}/Dockerfile"
    dest: "/opt/mini-soc/{{ item }}/"
  loop: [target, attacker]

- name: Copier la clé publique de CT-manager à côté des Dockerfiles
  copy:
    src: "{{ playbook_dir }}/ssh_keys/id_ed25519.pub"
    dest: "/opt/mini-soc/{{ item }}/"
  loop: [target, attacker]

- name: Construire les images soc-target et soc-attacker
  community.docker.docker_image:
    name: "soc-{{ item }}"
    source: build
    build:
      path: "/opt/mini-soc/{{ item }}"
  loop: [target, attacker]

- name: Lancer CT-target et CT-attacker sur infra_soc
  community.docker.docker_container:
    name: "{{ item.nom }}"
    hostname: "{{ item.nom }}"
    image: "{{ item.image }}"
    restart_policy: unless-stopped
    networks:
      - name: infra_soc
        ipv4_address: "{{ item.ip }}"
  loop:
    - { nom: CT-target,   image: soc-target,   ip: 192.168.70.30 }
    - { nom: CT-attacker, image: soc-attacker, ip: 192.168.70.40 }

# on attend que SSH réponde, sinon les rôles suivants échoueraient
- name: Attendre que SSH soit prêt sur les conteneurs
  wait_for:
    host: "{{ item }}"
    port: 22
    timeout: 60
  loop: [192.168.70.30, 192.168.70.40]
