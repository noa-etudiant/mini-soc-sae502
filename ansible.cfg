[defaults]
inventory = inventory/hosts.yml
roles_path = roles

# on se connecte partout en root avec la clé créée par bootstrap.sh
remote_user = root
private_key_file = ssh_keys/id_ed25519

# les conteneurs sont recréés souvent, leur empreinte SSH change à chaque fois
host_key_checking = False

# évite le message d'avertissement sur la version de python
interpreter_python = auto_silent
