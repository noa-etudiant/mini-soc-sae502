# Machines gérées par Ansible (en SSH depuis CT-manager)
# Elasticsearch et Kibana n'y sont pas : ce sont les images officielles, sans SSH,
# on les pilote depuis la VM avec les modules docker.
all:
  children:
    vm:
      hosts:
        vm-hote:
          ansible_host: 192.168.70.1   # la VM vue depuis le réseau infra_soc

    target:
      hosts:
        CT-target:
          ansible_host: 192.168.70.30

    attacker:
      hosts:
        CT-attacker:
          ansible_host: 192.168.70.40
