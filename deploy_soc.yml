---
# Playbook principal : déploie tout le mini-SOC
# lancement : ansible-playbook deploy_soc.yml --ask-vault-pass

- name: Préparation de la VM hôte
  hosts: vm
  roles:
    - vm_prep

# Elasticsearch et Kibana sont pilotés depuis la VM (images officielles sans SSH)
- name: Stack SIEM (Elasticsearch + Kibana)
  hosts: vm
  roles:
    - siem
